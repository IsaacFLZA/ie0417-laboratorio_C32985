name: C++ testing
on:
  push:
    branches: [main]
    paths:
      - 'laboratorio-testing/**'
      - '.github/workflows/testing.yml'
  pull_request:
    branches: [main]
    paths:
      - 'laboratorio-testing/**'
      - '.github/workflows/testing.yml'
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake lcov
      - name: Configure CMake
        run: cmake -S laboratorio-testing -B laboratorio-testing/build -DENABLE_COVERAGE=ON
      - name: Build
        run: cmake --build laboratorio-testing/build --parallel 2
      - name: Run tests
        run: ctest --test-dir laboratorio-testing/build --output-on-failure
      - name: Generate coverage report
        run: |
          cd laboratorio-testing/build
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' '*/_deps/*' '*/tests/*' --output-file coverage_filtered.info --ignore-errors unused
          genhtml coverage_filtered.info --output-directory coverage_report
          lcov --summary coverage_filtered.info
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: laboratorio-testing/build/coverage_report/
          if-no-files-found: error
